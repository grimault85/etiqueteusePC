name: Publication de l'application de bureau

# Trois façons de déclencher la publication :
#
#   1. Pousser un tag depuis un poste :
#        git tag v2.9.0
#        git push origin v2.9.0
#
#   2. Publier une Release depuis le site GitHub. Un tag créé par
#      l'interface web ne déclenche pas toujours l'événement « push » ;
#      l'événement « release » est lui garanti, et permet de tout faire
#      depuis un téléphone.
#
#   3. Lancer le workflow à la main depuis l'onglet Actions, en indiquant
#      le tag à publier. Utile pour relancer une compilation.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à compiler et publier (ex : v2.9.0)"
        required: true

jobs:
  compilation:
    strategy:
      fail-fast: false          # un échec macOS ne doit pas priver de la version Windows
      matrix:
        include:
          - os: windows-latest
            commande: dist:win
            nom: windows
          - os: macos-latest
            commande: dist:mac
            nom: macos

    runs-on: ${{ matrix.os }}
    steps:
      # Sur déclenchement manuel, on compile le tag demandé et non la branche.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install
        working-directory: desktop

      # --publish never est indispensable : la configuration "publish" du
      # package.json sert à electron-updater pour CHERCHER les mises à jour.
      # Sans cette option, electron-builder croit devoir publier lui-même la
      # Release et échoue faute de jeton. C'est le job « publication » qui
      # s'en charge, avec les droits nécessaires.
      - name: Compiler
        run: npm run ${{ matrix.commande }} -- --publish never
        working-directory: desktop

      - name: Lister ce qui a été produit
        if: always()
        shell: bash
        run: ls -la desktop/release || echo "dossier release absent"


      # latest.yml et les .blockmap sont indispensables à la mise à jour
      # automatique : sans eux, les applications déjà installées ne verront
      # jamais la nouvelle version.
      - name: Conserver les fichiers
        uses: actions/upload-artifact@v4
        with:
          name: binaire-${{ matrix.nom }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  publication:
    needs: compilation
    runs-on: ubuntu-latest
    permissions:
      contents: write           # nécessaire pour créer la Release

    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les fichiers compilés
        uses: actions/download-artifact@v4
        with:
          path: binaires

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Selon le déclencheur, le tag vient de l'entrée manuelle ou de la
          # référence Git courante.
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          VERSION="${TAG#v}"
          echo "Publication du tag $TAG (version $VERSION)"

          # Les noms de fichiers contiennent des espaces : on ne peut pas les
          # traiter comme une simple liste de mots.
          mapfile -d '' FICHIERS < <(find binaires -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.blockmap' -o -name 'latest*.yml' \) -print0)

          echo "Fichiers à publier :"
          printf '  %s\n' "${FICHIERS[@]}"

          if [ ${#FICHIERS[@]} -eq 0 ]; then
            echo "Aucun binaire produit : publication annulée." >&2
            exit 1
          fi

          cat > notes.md <<'FIN'
          ## Installation

          **Windows** — télécharger le `.exe` ci-dessous et le lancer. Windows
          affiche « éditeur inconnu » : cliquer sur *Informations complémentaires*
          → *Exécuter quand même*. L'application n'est pas signée par un
          certificat payant, l'avertissement est normal.

          **macOS** — télécharger le `.dmg`, l'ouvrir, glisser l'application dans
          le dossier Applications. Au premier lancement : clic droit sur l'icône
          → *Ouvrir*.

          Les applications Windows déjà installées proposeront d'elles-mêmes
          cette mise à jour.

          Les fichiers `latest.yml` et `.blockmap` servent à ce mécanisme :
          ne pas les retirer de la Release.
          FIN

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release existante : ajout des fichiers."
            gh release upload "$TAG" "${FICHIERS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "Étiqueteuse La Carte $VERSION" \
              --notes-file notes.md \
              "${FICHIERS[@]}"
          fi
